name: Build Android

# 在 downstream 分支上手动编译 Android arm64 (aarch64) APK。
# main 只用来同步上游，不跑这个 workflow。
# 优先用 ANDROID_KEY_* secrets 签名；没配则用临时 debug 密钥，保证 APK 可安装。
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"

jobs:
  android:
    name: Android (arm64)
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 对齐版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu runner 自带 Android SDK，不再用 android-actions/setup-android（它的 license 交互会卡住）
      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 APK（仅 arm64）
        run: pnpm tauri android build --apk --split-per-abi --target aarch64

      - name: 收集并签名 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk')
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::没有找到 release APK"
            exit 1
          fi

          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            ALIAS="${KEY_ALIAS:?ANDROID_KEY_ALIAS is empty}"
            STORE_PASS="${STORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is empty}"
            KEY_PASS="${KEY_PASSWORD:?ANDROID_KEY_PASSWORD is empty}"
          else
            echo "::warning::未配置 ANDROID_KEY_*，使用临时 debug 密钥签名（可安装，但每次构建签名不同）"
            ALIAS="hghub"
            STORE_PASS="android"
            KEY_PASS="android"
            keytool -genkeypair -noprompt \
              -keystore "$KS" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=HGhub CI, OU=CI, O=HGhub, C=US"
          fi

          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/$BT/zipalign"
          for f in "${apks[@]}"; do
            aligned="$RUNNER_TEMP/aligned.apk"
            "$ZIPALIGN" -p -f 4 "$f" "$aligned"
            out="artifacts/HGhub_${VERSION}_arm64-v8a.apk"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              --out "$out" "$aligned"
            "$APKSIGNER" verify --verbose --print-certs "$out"
          done
          rm -f "$KS" "$RUNNER_TEMP/aligned.apk"
          ls -lh artifacts

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-android-arm64
          path: artifacts/*
          if-no-files-found: error
